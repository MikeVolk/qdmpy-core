site_name: QDMpy
repo_url: https://github.com/mikevolk/QDMpy
site_description: Quantum Diamond Microscopy Data Analysis in Python
site_author: Michael Volk

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Tutorials:
      - Overview: tutorials/index.md
      - "01 · Quickstart": tutorials/01-quickstart.ipynb
      - "02 · Exploring Data": tutorials/02-exploration.ipynb
      - "03 · Extending": tutorials/03-extending.ipynb
      - "04 · Spectral Folding": tutorials/04-spectral-folding.ipynb
      - "05 · Plotting": tutorials/05-plotting.ipynb
      - "06 · Source Fitting": tutorials/06-source-fitting.ipynb
  - Guides:
      - Processors: tutorials/processors.md
      - ESR Models: tutorials/models.md
      - Fitting Quality: tutorials/fitting.md
      - Spectral Folding: tutorials/spectral-folding.md
      - Settings: tutorials/settings_configuration.md
      - Extending: extending.md
  - API Reference: api/index.md
  - Migration Guide: migration.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            show_root_heading: true
            merge_init_into_class: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
  - mkdocs-jupyter:
      include_source: true
      execute: true
      execute_ignore:
        - "tutorials/.archive/*.ipynb"
        - "tutorials/.ipynb_checkpoints/*.ipynb"
        - "tutorials/processor_tutorial.ipynb"

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mikevolk/QDMpy
      name: QDMpy on GitHub

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
