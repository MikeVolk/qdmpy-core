repos:
  # Core pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-json
      - id: check-yaml
        exclude: mkdocs\.yml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-added-large-files
        args: ['--maxkb=1500']
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'develop']

  # Strip outputs and metadata from Jupyter notebooks (Rust — ~200x faster than nbstripout)
  - repo: https://github.com/deshaw/nbstripout-fast
    rev: v1.1.1
    hooks:
      - id: nbstripout-fast

  # Use locally-installed ruff and ty (avoids version skew, reuses ruff.toml)
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        language: system
        entry: uv run ruff check --fix
        types: [python]
      - id: ruff-format
        name: ruff (format)
        language: system
        entry: uv run ruff format
        types: [python]
      - id: ty
        name: ty (type check)
        language: system
        entry: uv run ty check src/qdmpy
        pass_filenames: false
        types: [python]
