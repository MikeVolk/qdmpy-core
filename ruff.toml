line-length = 100

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear
    "I",    # isort
    "N",    # pep8-naming
    "Q",    # flake8-quotes
    "S",    # flake8-bandit
    "D",    # pydocstyle
    "C90",  # mccabe complexity
    "ANN",  # Type annotations
    "UP",   # pyupgrade
    "RUF",  # Ruff-specific rules
    "PT",   # pytest
    "ERA",  # eradicate
    "TRY",  # tryceratops
    "SIM",  # simplify
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "PL",   # Pylint
    "A",    # flake8-builtins
    "G",    # flake8-logging-format
    "PIE",  # flake8-pie
    "T20",  # flake8-print
]

ignore = [
    "D203",  # one-blank-line-before-class (conflicts with no-blank-line-before-class)
    "D213",  # multi-line-summary-second-line (conflicts with multi-line-summary-first-line)
    "COM812", # Avoid conflicts with formatter
    "Q000",   # Avoid conflicts with formatter quote style
    "Q003"    # Avoid conflicts with formatter quote style
]

[lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D103", "ANN101", "S101", "PT015", "B011"]  # Allow missing docstrings and test assertions in tests
"**/__init__.py" = ["F401", "E402"]  # Ignore unused imports and module level imports not at top in __init__.py files
"tutorial.ipynb" = ["ALL"]   # Ignore all errors in notebooks
"test.ipynb" = ["ALL"]       # Ignore all errors in notebooks

[lint.pydocstyle]
convention = "google"

[lint.isort]
required-imports = ["from __future__ import annotations"]

[lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"

[lint.mccabe]
max-complexity = 10