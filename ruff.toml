line-length = 100

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear
    "I",    # isort
    "N",    # pep8-naming
    "Q",    # flake8-quotes
    "S",    # flake8-bandit
    "D",    # pydocstyle
    "C90",  # mccabe complexity
    "ANN",  # Type annotations
    "UP",   # pyupgrade
    "RUF",  # Ruff-specific rules
    "PT",   # pytest
    "ERA",  # eradicate
    "TRY",  # tryceratops
    "SIM",  # simplify
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "PL",   # Pylint
    "A",    # flake8-builtins
    "G",    # flake8-logging-format
    "PIE",  # flake8-pie
    "T20",  # flake8-print
]

ignore = [
    "D203",  # one-blank-line-before-class (conflicts with no-blank-line-before-class)
    "D213",  # multi-line-summary-second-line (conflicts with multi-line-summary-first-line)
    "COM812", # Avoid conflicts with formatter
    "Q000",   # Avoid conflicts with formatter quote style
    "Q003"    # Avoid conflicts with formatter quote style
]

[lint.per-file-ignores]
"tests/*" = [
    # Docstrings - not needed in tests
    "D100", "D101", "D102", "D103", "D104", "D105", "D107", "D205", "D414", "D415",
    # Type annotations - less critical in tests
    "ANN001", "ANN101", "ANN201", "ANN202", "ANN401",
    # Test-specific patterns
    "S101",  # assert
    "PT015", "PT011", "PT009", "PT012",  # pytest assertions
    "B011",  # assert False
    # Magic values and constants in test data
    "PLR2004",  # magic-value-comparison
    # Variable naming in tests
    "N806", "N803", "N802",  # non-lowercase variable names
    # Exception handling is less critical in tests
    "TRY003", "B904", "TRY300", "TRY301",
    # Unused arguments in test fixtures
    "ARG001", "ARG002", "ARG005",
    # Print statements during debugging
    "T201",
    # Complexity - tests can be more complex for data setup
    "C901", "PLR0912", "PLR0913", "PLR0915",
]
"**/__init__.py" = ["F401", "E402"]  # Ignore unused imports and module level imports not at top in __init__.py files
"tutorial.ipynb" = ["ALL"]   # Ignore all errors in notebooks
"test.ipynb" = ["ALL"]       # Ignore all errors in notebooks

[lint.pydocstyle]
convention = "google"

[lint.isort]
required-imports = ["from __future__ import annotations"]

[lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"

[lint.mccabe]
max-complexity = 10