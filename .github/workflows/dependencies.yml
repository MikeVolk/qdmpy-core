name: Autoupdate dependencies
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

jobs:
  auto-update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v3
      - run: uv sync

      - name: Gather outdated dependencies
        id: check_for_outdated_dependencies
        run: |
          body=$(uv lock --dry-run --upgrade 2>&1 | grep -E '^(Update|Add|Remove) ' || true)
          {
            echo 'body<<OUTDATED_EOF'
            echo "$body"
            echo 'OUTDATED_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Update outdated packages
        if: ${{ steps.check_for_outdated_dependencies.outputs.body != '' }}
        run: uv lock --upgrade

      # behaviour if PR already exists: https://github.com/marketplace/actions/create-pull-request#action-behaviour
      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ steps.check_for_outdated_dependencies.outputs.body != '' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ env.GITHUB_TOKEN }}
          commit-message: >-
            chore: update dependencies
          title: "[Actions] Auto-Update dependencies"
          body: |
            The following packages are outdated

            ```
            ${{ steps.check_for_outdated_dependencies.outputs.body }}
            ```
          branch: chore/update-dependencies
          delete-branch: true
