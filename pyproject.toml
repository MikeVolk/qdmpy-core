[project]
name = "qdmpy-core"
version = "0.0.1"
description = "A python package for calculating magnetic maps from ODMR spectra measured on a quantum diamond microscope"
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mike Volk", email = "mike@example.com"}
]
dependencies = [
    # numerical core
    "numpy>=2.0,<3.0", # upper bound: numba 0.61 compatibility
    "scipy>=1.15.2",
    "xarray>=2026.2.0",
    "numba>=0.61.0",
    # data I/O
    "mat73>=0.65",
    "h5py>=3.10",
    # visualization
    "matplotlib>=3.10.1",
    # GPU fitting (local wheels via [tool.uv.sources])
    "pygpufit",
    # settings & validation
    "pydantic-settings>=2.4.0",
    # logging
    "loguru>=0.7.3",
    "tomli>=2.4.0",
]

[project.urls]
Documentation = "https://mikevolk.github.io/qdmpy-core"
Homepage = "https://mikevolk.github.io/qdmpy-core"
Repository = "https://github.com/mikevolk/qdmpy-core"


[tool.uv.sources]
pygpufit = [
    { path = "src/pyGpufit/win/pyGpufit-1.2.0-py2.py3-none-any.whl", marker = "sys_platform == 'win32'" },
    { path = "src/pyGpufit/linux/pygpufit-1.3.0-py2.py3-none-any.whl", marker = "sys_platform != 'win32'" },
]

[dependency-groups]
test = [
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.10",
    "mkdocstrings>=0.29.0",
    "mkdocstrings-python>=1.16.8",
    "mkdocs-jupyter>=0.25.1",
]
dev = [
    "jupyterlab>=4.3.1",
    "ruff>=0.7.4",
    "ty>=0.0.17",
    {include-group = "test"},
    {include-group = "docs"},
    "hypothesis>=6.151.9",
    "pre-commit>=4.5.1",
]

[tool.pytest.ini_options]
addopts = """\
    --cov qdmpy \
    --cov tests \
    --cov-report term-missing \
    --no-cov-on-fail \
"""

[tool.coverage.report]
fail_under = 80
exclude_lines = ['if TYPE_CHECKING:', 'pragma: no cover']

[tool.mypy]
#disallow_any_unimported = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
#warn_return_any = true
check_untyped_defs = true
show_error_codes = true
ignore_missing_imports = true

[project.scripts]
qdmpy = "qdmpy.cli:main"

[tool.uv]
package = true
