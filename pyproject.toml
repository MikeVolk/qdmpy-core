[project]
name = "QDMpy"
version = "0.0.1"
description = "A python package for calculating magnetic maps from ODMR spectra measured on a quantum diamond microscope"

documentation = "https://mikevolk.github.io/QDMpy"
homepage = "https://mikevolk.github.io/QDMpy"
repository = "https://github.com/mikevolk/QDMpy"
requires-python = ">=3.12"

dependencies = [
    "numpy<=2.1",
    "matplotlib>=3.9.2",
    "tomli>=2.1.0",
    "scikit-learn>=1.5.2",
    "pandas>=2.2.3",
    "mat73>=0.65",
    "pygpufit",
    "coloredlogs>=15.0.1",
    "scikit-image>=0.24.0",
    "pre-commit>=4.0.1",
    "numba>=0.61.0",
    "pytest>=8.3.5",
    "mypy>=1.15.0",
    "jupyterlab>=4.3.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.4",
]

[tool.uv.sources]
pygpufit = [
    { path = "src/pyGpufit/win/pyGpufit-1.2.0-py2.py3-none-any.whl", marker = "sys_platform == 'win32'" },
    { path = "src/pyGpufit/linux/pyGpufit-1.2.0-py2.py3-none-any.whl", marker = "sys_platform != 'win32'" },
]

[tool.pytest.ini_options]
addopts = """\
    --cov QDMpy \
    --cov tests \
    --cov-report term-missing \
    --no-cov-on-fail \
"""

[tool.coverage.report]
fail_under = 80
exclude_lines = ['if TYPE_CHECKING:', 'pragma: no cover']

[tool.mypy]
#disallow_any_unimported = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
#warn_return_any = true
check_untyped_defs = true
show_error_codes = true
ignore_missing_imports = true

[dependency-groups]
dev = ["jupyterlab>=4.3.1", "mkdocs>=1.6.1", "ruff>=0.7.4"]
