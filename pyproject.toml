[project]
name = "QDMpy"
version = "0.0.1"
description = "A python package for calculating magnetic maps from ODMR spectra measured on a quantum diamond microscope"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mike Volk", email = "mike@example.com"}
]
dependencies = [
    "numpy<=2.1",
    "matplotlib>=3.9.2",
    "tomli>=2.1.0",
    "scikit-learn>=1.5.2",
    "pandas>=2.2.3",
    "mat73>=0.65",
    "pygpufit",
    "scikit-image>=0.24.0",
    "numba>=0.61.0",
    "argparse",
    "importlib-metadata",
    "pytest>=8.3.5",
    "mypy>=1.15.0",
    "mkdocs-material>=9.6.10",
    "mkdocstrings>=0.29.0",
    "mkdocstrings-python>=1.16.8",
    "mkdocs-jupyter>=0.25.1",
    "pytest-cov>=6.0.0",
]

[project.urls]
Documentation = "https://mikevolk.github.io/QDMpy"
Homepage = "https://mikevolk.github.io/QDMpy"
Repository = "https://github.com/mikevolk/QDMpy"


[tool.uv.sources]
pygpufit = [
    { path = "src/pyGpufit/win/pyGpufit-1.2.0-py2.py3-none-any.whl", marker = "sys_platform == 'win32'" },
    { path = "src/pyGpufit/linux/pyGpufit-1.2.0-py2.py3-none-any.whl", marker = "sys_platform != 'win32'" },
]

[tool.pytest.ini_options]
addopts = """\
    --cov QDMpy \
    --cov tests \
    --cov-report term-missing \
    --no-cov-on-fail \
"""

[tool.coverage.report]
fail_under = 80
exclude_lines = ['if TYPE_CHECKING:', 'pragma: no cover']

[tool.mypy]
#disallow_any_unimported = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
#warn_return_any = true
check_untyped_defs = true
show_error_codes = true
ignore_missing_imports = true

[dependency-groups]
dev = ["jupyterlab>=4.3.1", "mkdocs>=1.6.1", "ruff>=0.7.4"]

[project.scripts]
qdmpy = "QDMpy.cli:main"
calculate_QDMio = "QDMpy.cli.calculate_QDMio:main"
